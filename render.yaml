databases:
  - name: estudio-yoga-db
    plan: free
    databaseName: estudio_yoga
    user: estudio_yoga

services:
  - type: web
    name: estudio-yoga
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: estudio-yoga-db
          property: connectionString
      - key: APP_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: WHATSAPP_DRIVER
        value: log
      - key: EMAIL_DRIVER
        value: log
